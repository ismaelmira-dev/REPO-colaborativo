<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section class="contact-section">

        <div class="contact-container">

            <div class="contact-info">
                <h2>Contáctanos</h2>
                <p>Si tienes alguna pregunta o sugerencia puedes enviarnos un mensaje.</p>
                <div class="info-item">📧 correo@ejemplo.com</div>
                <div class="info-item">📞 +57 300 000 0000</div>
                <div class="info-item">📍 Medellín, Colombia</div>
            </div>


            <div class="contact-form">

                <h3>Enviar mensaje</h3>

                <form id="formulario">

                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="input-group">
                        <label>Correo electrónico</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label>Mensaje</label>
                        <textarea id="mensaje" rows="4" required></textarea>
                    </div>

                    <button type="submit">Enviar mensaje</button>

                    <p id="respuesta"></p>

                </form>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
